name: Build apps

# Compila l'app per Windows, Linux e macOS:
# - ad ogni tag "v*" (es. v1.0.0) e allega gli archivi alla Release
# - manualmente dalla scheda Actions (workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            name: win-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            name: linux-x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Package (electron-packager)
        run: npx electron-packager . "LabelForge" --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=dist-app --overwrite

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist-app/*" -DestinationPath "LabelForge-${{ matrix.name }}.zip"

      - name: Archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: cd dist-app && zip -r "../LabelForge-${{ matrix.name }}.zip" . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelForge-${{ matrix.name }}
          path: LabelForge-${{ matrix.name }}.zip

      # Note di rilascio automatiche: release-notes/<tag>.md oppure la sezione del CHANGELOG
      # (+ release-notes/_footer.md). Niente più modifiche manuali della Release.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node .github/scripts/release-notes.js "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LabelForge ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: LabelForge-${{ matrix.name }}.zip
